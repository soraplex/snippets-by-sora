<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="catalog-card.css" />
    <title>Card</title>
  </head>
  <body>
    <main>
      <article class="card">
        <img
          src="https://img.abercrombie.com/is/image/anf/KIC_123-4222-00226-903_prod1.jpg?policy=product-large"
          alt="card image"
          class="card-image"
        />
        <div class="card-content">
          <h2 class="card-title">T shirt</h2>
          <p class="card-text">this is a card without a button</p>
          <footer class="card-footer">
            <span class="card-price">$20</span>
          </footer>
        </div>
      </article>
      <article class="card">
        <img
          src="https://img.abercrombie.com/is/image/anf/KIC_123-4222-00226-903_prod1.jpg?policy=product-large"
          alt="card image"
          class="card-image"
        />
        <div class="card-content">
          <h2 class="card-title">T shirt</h2>
          <p class="card-text">this is a card with a button</p>
          <footer class="card-footer">
            <span class="card-price">$20</span>
            <button class="btn">Buy</button>
          </footer>
        </div>
      </article>
    </main>
  </body>
</html>
