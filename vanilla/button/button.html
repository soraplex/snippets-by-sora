<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="button.css" />
    <title>buttons</title>
  </head>
  <body>
    <main class="content">
      <h1 class="title">My Skills</h1>

      <!-- Bold Tokens -->
      <div class="skills-grid">
        <button class="skill-pill bold-primary">primary</button>
        <button class="skill-pill bold-secondary">secondary</button>
        <button class="skill-pill bold-success">success</button>
        <button class="skill-pill bold-danger">danger</button>
        <button class="skill-pill bold-warning">warning</button>
        <button class="skill-pill bold-info">info</button>
        <button class="skill-pill bold-dark">dark</button>
      </div>
      <!-- Pastel Tokens -->
      <div class="skills-grid">
        <button class="skill-pill pastel-primary">primary</button>
        <button class="skill-pill pastel-secondary">secondary</button>
        <button class="skill-pill pastel-success">success</button>
        <button class="skill-pill pastel-danger">danger</button>
        <button class="skill-pill pastel-warning">warning</button>
        <button class="skill-pill pastel-info">info</button>
        <button class="skill-pill pastel-dark">dark</button>
      </div>
    </main>
  </body>
</html>
