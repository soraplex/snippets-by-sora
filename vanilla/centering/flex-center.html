<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>flex centering</title>
  </head>
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    .center-flex {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #cfe3ff;
    }

    .box {
      padding: 20px 40px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 12px;
    }
  </style>
  <body>
    <main>
      <section class="center-flex">
        <p class="box">flexbox center</p>
      </section>
    </main>
  </body>
</html>
