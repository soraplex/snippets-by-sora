<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>grid centering</title>
  </head>
  <style>
    body {
      margin: 0;
    }

    .center-grid {
      height: 100vh;
      display: grid;
      place-items: center;
      background: #d9f0ff;
    }

    .box {
      padding: 20px 40px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 12px;
    }
  </style>
  <body>
    <main>
      <section class="center-grid">
        <p class="box">grid center</p>
      </section>
    </main>
  </body>
</html>
