<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>absolute centering</title>
  </head>
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    .center-absolute {
      height: 100vh;
      position: relative;
      background: #e8f6ff;
    }

    .box {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 20px 40px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 12px;
    }
  </style>
  <body>
    <main>
      <section class="center-absolute">
        <p class="box">Absolute Center</p>
      </section>
    </main>
  </body>
</html>
