<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="table.css">
    <title>Document</title>
  </head>
  <body>
    <header class="watchlist-header">
      <section class="watchlist-info">
        <h1>S&P 500 Watchlist</h1>
        <p>NYSE · NASDAQ · Sep 22, 2026 · 4:00 PM ET</p>
      </section>

      <aside class="legend" aria-label="Market movement legend">
        <span>
          <span class="dot" style="background: #16a34a"></span>
          Gaining
        </span>
        <span>
          <span class="dot" style="background: #dc2626"></span>
          Losing
        </span>
      </aside>
    </header>

    <main>
      <section class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th scope="col">Company</th>
              <th scope="col" class="num">Price</th>
              <th scope="col" class="num">24h Change</th>
              <th scope="col" class="num">Open</th>
              <th scope="col" class="num">52w High</th>
              <th scope="col" class="num">52w Low</th>
              <th scope="col" class="num">Mkt Cap</th>
              <th scope="col" class="num">P/E</th>
              <th scope="col">Sector</th>
            </tr>
          </thead>

          <tbody id="table-body"></tbody>
        </table>
      </section>
    </main>
    <script src="stock-data.js"></script>
    <script src="table.js"></script>
  </body>
</html>
